name: Python CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

run-name: CI triggered by @${{ github.actor }} | commit:${{ github.sha }}

env:
  PYTHON_VERSION: "3.10"

jobs:
  python-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov flake8

      - name: Run Tests & Coverage
        run: |
          pytest --cov=. --cov-report=term-missing

      - name: Check Code Style (flake8)
        continue-on-error: true
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check Code Complexity
        continue-on-error: true
        run: |
          flake8 . --exit-zero --max-complexity=10 --statistics

      - name: Upload Python Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-source-code
          path: .
