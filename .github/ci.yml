name: Python CI
run-name: User ${{ github.actor }} - Commit ${{ github.sha }}

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  python-ci:
    name: Python CI
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: '3.9'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint code style
        run: flake8 . --show-source --statistics --exit-zero

      - name: Check code complexity
        run: flake8 . --max-complexity=10 --statistics --exit-zero

      - name: Run tests
        run: pytest

      - name: Generate and display coverage report
        run: pytest --cov=. --cov-report=term-missing

      - name: Upload Python code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-src-code
          path: .