name: Workflow started by user
run-name: Started by ${{ github.actor }} - commit ${{ github.sha }}

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  python-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src

    env:
      PythonVersion: 3.8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PythonVersion }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PythonVersion }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 coverage
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 . --show-source --statistics

      - name: Check complexity
        run: |
          cd ../
          flake8 . --exit-zero --max-complexity=10 --statistics

      - name: Run unit tests
        run: python manage.py test

      - name: Generate coverage report
        run: coverage run --source='.' manage.py test

      - name: Display coverage report in console
        run: coverage report

      - name: Upload Python code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: todoapp-source-code
          path: src
