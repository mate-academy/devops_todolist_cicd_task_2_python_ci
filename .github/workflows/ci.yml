name: python-deployment

run-name: ${{ github.actor }} - ${{ github.sha }}

env:
  PYTHON_VERSION: 3.8

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["main"]

jobs:
  python-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          pip install -r src/requirements.txt
      - name: Check Style Code
        run: |
          flake8 . --show-source --statistics
      - name: Check Complexity
        run: |
          cd ../
          flake8 . --exit-zero --max-complexity=10 --statistics
      - name: Test with pytest
        run: |
          pytest -v --cov-report=term-missing --cov=. --cov-report=json

      - name: Upload Python code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-source-code
          path: .

