name: ci
run-name: User triggering the workflow - ${{ github.actor }}, hash - ${{ github.sha }}

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  PYTHON_VERSION: 3.8

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-django coverage

      - name: Install requirements
        working-directory: ./src/
        run: pip install -r requirements.txt

      - name: Runing tests and coverage report
        working-directory: ./src/
        run: |
          coverage run -m pytest -v
          coverage report -m


      - name: Lint
        working-directory: ./src/
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Code complexity check
        working-directory: ./src/
        run: |
          flake8 . --statistics --max-complexity=10 --exit-zero

      - name: Uploading Python code as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-source
          path: .
