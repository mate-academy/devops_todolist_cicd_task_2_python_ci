name: python-workflow - ${{ github.actor }} - ${{ github.sha }}
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  python-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --cov=. --cov-report=json

      - name: Show coverage report
        run: |
          if [ -f coverage.json ]; then
            jq . coverage.json || cat coverage.json
          else
            echo "coverage.json not found"
          fi



#  step that checks the code style. (Code style is checked with flake8.) This should not be a blocker for the workflow.
#  step that checks the complexity of the code. (Code complexity is checked with flake8.) This should not be a blocker to the workflow.
#  step that uploads Python code as an artifact.
#  The Python version should be controlled from the variable.
