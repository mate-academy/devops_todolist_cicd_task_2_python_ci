name: Python CI

run-name: Python CI | ${{ github.actor }} | ${{ github.sha }}

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  python-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install coverage flake8

      - name: Run tests
        run: python manage.py test

      - name: Generate coverage
        run: coverage run --source=. manage.py test

      - name: Display coverage report
        run: coverage report --show-missing

      - name: Check code style
        continue-on-error: true
        run: flake8 . --show-source --statistics

      - name: Check code complexity
        continue-on-error: true
        run: flake8 . --select C901 --max-complexity=10 --statistics

      - name: Upload Python source code
        uses: actions/upload-artifact@v7
        with:
          name: python-source-${{ github.sha }}
          path: src/**/*.py
          if-no-files-found: error
          retention-days: 7