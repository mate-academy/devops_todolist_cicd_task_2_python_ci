name: Django ToDo CI
run-name: Запуск від ${{ github.actor }}, коміт ${{ github.sha }}

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  PYTHON_VER: "3.10"

jobs:
  python-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Отримання коду (Checkout)
        uses: actions/checkout@v4

      - name: Налаштування версії Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Встановлення залежностей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage flake8

      - name: 1 & 2. Запуск тестів та створення покриття (coverage)
        run: coverage run manage.py test

      - name: 3. Вивід звіту coverage у консоль
        run: coverage report

      - name: 4. Перевірка стилю коду flake8 (не блокує workflow)
        continue-on-error: true
        run: flake8 .

      - name: 5. Перевірка складності коду flake8 (не блокує workflow)
        continue-on-error: true
        run: flake8 . --max-complexity=10

      - name: 6. Завантаження Python коду як артефакту
        uses: actions/upload-artifact@v4
        with:
          name: python-source-code
          path: ./**/*.py