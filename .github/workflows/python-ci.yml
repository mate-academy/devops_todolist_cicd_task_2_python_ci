name: Python CI
run-name: triggered by ${{ github.actor }} for ${{ github.sha }}

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: '3.8'

jobs:
  Python-CI:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest autopep8 isort black coverage
          pip install -r requirements.txt

      - name: Run autopep8
        run: autopep8 --in-place --aggressive --aggressive --recursive .

      - name: Sort imports with isort
        run: isort .

      - name: Format code with Black
        run: black .

      - name: Lint
        run: сflake8 . --show-source --statistics
        continue-on-error: true

      - name: Check code complexity
        run: flake8 --statistics --max-complexity 10 --exit-zero
        continue-on-error: true

      - name: Run tests
        run: pytest

      - name: Generate coverage report
        run: coverage run -m pytest

      - name: Display coverage report
        run: coverage report

      - name: Upload coverage report
        uses: actions/upload-artifact@v2
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload Python code as an artifact
        uses: actions/upload-artifact@v2
        with:
          name: python-code
          path: ./src
