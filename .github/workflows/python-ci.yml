name: Python CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: '3.9'  # Specify the Python version you want to use
  DJANGO_SETTINGS_MODULE: 'todolist.settings'  # Adjust to the actual path of your settings module

jobs:
  Python-CI:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover

      - name: Generate coverage
        run: |
          coverage run -m unittest discover
          coverage report

      - name: Check code style
        run: |
          flake8 --ignore=E501

      - name: Check code complexity
        run: |
          flake8 --max-complexity=10

      - name: Upload Python code as artifact
        uses: actions/upload-artifact@v2
        with:
          name: python-code
          path: ./src  # Ensure this path correctly points to your codebase
