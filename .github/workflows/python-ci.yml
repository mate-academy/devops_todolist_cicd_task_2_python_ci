name: Python CI
run-name: triggered by ${{ github.actor }} for ${{ github.sha }}

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: '3.8'

jobs:
  Python-CI:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest autopep8 isort black
          pip install -r requirements.txt

      - name: Run autopep8
        run: |
          autopep8 --in-place --aggressive --aggressive ./lists/views.py
          autopep8 --in-place --aggressive --aggressive ./todolist/settings.py
          autopep8 --in-place --aggressive --aggressive ./todolist/wsgi.py

      - name: Sort imports with isort
        run: |
          isort ./lists/views.py
          isort ./todolist/settings.py
          isort ./todolist/wsgi.py

      - name: Format code with Black
        run: |
          black ./lists/views.py
          black ./todolist/settings.py
          black ./todolist/wsgi.py

      - name: Lint
        run: |
          flake8 . --show-source --statistics
