name: todolist ci
run-name: ${{ github.actor }} - ${{ github.sha }}

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: 3.10

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage flake8

      - name: Run unit tests
        run: |
          pytest

      - name: Generate coverage
        run: |
          coverage run -m pytest

      - name: Display the coverage report to console
        run: |
          coverage report -m

      - name: Check codestyle
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Check complexity
        run: |
          flake8 . --statistics --max-complexity=10 --exit-zero

      - name: Upload python code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-source
          path: ./src