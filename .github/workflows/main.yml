name: CI
run-name: ${{ github.actor }} - ${{ github.sha }}
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
env:
  PYTHON_VERSION: "3.10"
jobs:
  python-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 coverage
          pip install -r requirements.txt

      - name: Generate coverage and run tests
        run: coverage run --source=. manage.py test api

      - name: Display coverage report
        run: coverage report

      - name: Lint with Flake8
        run: |
          cd ../
          flake8 . --show-source --statistics --exit-zero

      - name: Upload Python code
        uses: actions/upload-artifact@v4
        with:
          name: python-code
          path: .

      - name: Check Complexity
        run: |
          cd ../
          flake8 . --exit-zero --max-complexity=10 --statistics
