name: python-development

run-name: "Action triggerd by ${{ github.actor }} user with commit ${{ github.sha }}"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  python-ci:
    env:
      PythonVersion: 3.14
    
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src
      
    steps:
      - name: Clone git repository
        uses: actions/checkout@v7.0.0

      - name: Set up Python v${{ env.PythonVersion }}
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PythonVersion }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 coverage
          pip install -r requirements.txt

      - name: Test application
        run: python manage.py test
        continue-on-error: true
        
      - name: Generate coverage report
        run: coverage manage.py test
        
      - name: Coverage report
        run: coverage report

      - name: Check code style with flake8
        run: flake8 --statistics

      - name: Check complexity of the code
        run: flake8 --max-complexity 10 --statistics

      - name: Upload python code as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-code
      
      
