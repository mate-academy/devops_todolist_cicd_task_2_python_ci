name: "todolist cicd task 2 python ci"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: "3.8"

jobs:
  python-ci:
    runs-on: ubuntu-latest
    name: "Python CI - Triggered by ${{ github.actor }} - Commit ${{ github.sha }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage flake8

      - name: Run tests
        run: python -m unittest discover app

      - name: Generate coverage report
        run: coverage run -m unittest discover app

      - name: Display coverage report
        run: coverage report

      - name: Check code style (flake8)
        run: flake8 app || true

      - name: Check code complexity (flake8)
        run: flake8 --max-complexity=10 app || true

      - name: Upload Python code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-code
          path: app/

