name: python-app
run-name: ${{ github.actor }} - ${{ github.sha }}

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: '3.8'

jobs:
  python-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v7
      name: Setup Python ${{ env.PYTHON_VERSION }}
      with:
        python-version: '${{ env.PYTHON_VERSION }}'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 coverage
        pip install -r requirements.txt

    - name: Run unit tests with coverage
      run: |
        coverage run manage.py test

    - name: Create coverage html
      run: |
        coverage html

    - name: Output the report to the console
      run: |
        coverage report

    - name: Lint
      run: |
        cd ../
        flake8 . --show-source --statistics --exit-zero

    - name: Check Complexity
      run: |
        cd ../
        flake8 . --statistics --max-complexity=10 --exit-zero

    - name: Upload Python code as artifact
      uses: actions/upload-artifact@v7
      with:
        name: python-code
        path: src/