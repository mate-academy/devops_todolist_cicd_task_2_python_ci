name: todoapp-deployment
run-name: ${{ github.actor }} triggered it on ${{ github.ref_name }} with commit hash ${{ github.sha }}

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

  workflow_dispatch:

env:
  PYTHON_VERSION: 3.8

jobs:
  python-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        name: Setup Python ${{ env.PYTHON_VERSION }}
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 coverage
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          cd ../
          flake8 . --show-source --statistics

      - name: Check Complexity
        run: |
          cd ../
          flake8 . --exit-zero --max-complexity=10 --statistics

      - name: Run tests
        run: |
          python manage.py test -v2

      - name: Generate and display coverage report in console
        run: |
          coverage run --source='.' manage.py test -v2
          coverage report

      - name: Upload Python code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-source
          path: |
            **/*.py
