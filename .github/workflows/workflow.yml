name: Django-CI
run-name:  ${{ github.actor }} runs the tests with ${{ github.sha }}

env:
  PYTHON_VERSION: 3.8


on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main", "develop" ]

jobs:
  python-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django-coverage flake8
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python manage.py test

      - name: Coverage Test
        run: |
          coverage run --source="." manage.py test --settings=path.to.test_settings
          coverage report -m

      - name: Flake8 Lint Test
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Flake8 Complexity Test
        run: |
          flake8 . --statistics --max-complexity=10 --exit-zero

      - name: Upload Python Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-source-code       # The name of the downloadable zip file
          path: |
            ./**/*.py                    # Uploads all .py files in the repo
            !**/venv/**                  # Excludes your virtual environment folder
            !**/__pycache__/**           # Excludes Python cache files
          retention-days: 7