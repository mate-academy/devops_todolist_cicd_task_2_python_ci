name: python-deployment-workflow
run-name: ${{ github.actor }} - ${{ github.sha }}

env:
  PYTHON_VERSION: 3.8

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  python-ci:
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage flake8

    - name: Lint with flake8
      run: |
        flake8 . --show-source --statistics --exit-zero

    - name: Complexity Check
      run: |
        flake8 . --max-complexity 10 --statistics --exit-zero

    - name: Generate coverage data
      run: coverage run manage.py test

    - name: Display coverage report
      run: coverage report

    - name: Upload source code as artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-source-code
        path: |
          .