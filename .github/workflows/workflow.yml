name: Python CI/CD
run-name: ${{ github.actor }} - ${{ github.sha }}

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: 3.9

jobs:
  python-ci:
    # The run name includes the triggering user and the commit hash.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage flake8

      - name: Run tests
        run: |
          python manage.py test -v2

      - name: Generate coverage report
        run: |
          coverage run --source='.' manage.py test -v2

      - name: Display coverage report in console
        run: |
          coverage report

      - name: Check code style with flake8
        run: |
          flake8 --show-source --statistics .
        continue-on-error: true

      - name: Check code complexity with flake8 (Cyclomatic Complexity)
        run: |
          flake8 --statistics --max-complexity 10 .
        continue-on-error: true

      - name: Upload Python code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-source
          path: |
            **/*.py
