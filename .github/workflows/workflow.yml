name: python-deployment
run-name: ${{ github.actor }} - Commit ${{ github.sha }}

on: 
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  PythonVersion: 3.8

jobs:
  python-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        name: Set up Python ${{ env.PythonVersion }}
        with:
          python-version: '${{ env.PythonVersion }}'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          pip install -r src/requirements.txt      
      
      - name: Test with pytest
        run: |	
          pytest -v src --cov=src --cov-report=term-missing --cov-report=json

      - name: Lint
        run: |
          flake8 src --show-source --statistics

      - name: Check Complexity
        run: |
          flake8 src --exit-zero --max-complexity=10 --statistics

      - name: Upload Python code
        uses: actions/upload-artifact@v4
        with:
          name: python-source
          path: src/






