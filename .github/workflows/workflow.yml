name: python-deployment
run-name: ${{ github.actor }} - ${{ github.sha }}

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: 3.8

jobs:
  python-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v6
      name: Setup Python ${{ env.PYTHON_VERSION }}
      with:
        python-version: '${{ env.PYTHON_VERSION }}'

    - name: Install Dependecies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov pytest-django
        pip install -r requirements.txt

    - name: Run unit tests with pytest
      run: |
        pytest -v --cov=. --cov-report=term-missing --cov-report=json

    - name: Lint
      continue-on-error: true
      run: |
        cd ../
        flake8 . --show-source --statistics

    - name: Check Complexity
      continue-on-error: true
      run: |
        cd ../
        flake8 . --statistics --max-complexity=10 --exit-zero

    - name: Upload Python code artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-source-code
        path: ./src/
