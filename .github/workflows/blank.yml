name: todolist-test
run-name: CI by ${{ github.actor }} – Commit ${{ github.sha }}

on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main

env:
  PythonVersion: 3.8

jobs:
  python-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PythonVersion }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PythonVersion }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 coverage

      - name: Check code style
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Check complexity of the code
        run: |
          flake8 . --max-complexity=10 --statistics --exit-zero

      - name: Run tests with coverage
        run: |
          coverage run manage.py test

      - name: Display coverage report
        run: |
          coverage report -m

      - name: Upload Python code as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: django_todo_app
          path: .
