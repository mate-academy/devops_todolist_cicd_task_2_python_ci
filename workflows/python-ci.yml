name: ci

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.10"

jobs:
  python-ci:
    name: Run by ${{ github.actor }} on commit ${{ github.sha }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage flake8

      - name: Run tests with coverage
        run: coverage run manage.py test

      - name: Show coverage report
        run: coverage report -m

      - name: Lint with flake8 (style check, non-blocking)
        continue-on-error: true
        run: flake8 .

      - name: Complexity check with flake8 (non-blocking)
        continue-on-error: true
        run: flake8 . --max-complexity=10

      - name: Upload Python code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: |
            **/*.py